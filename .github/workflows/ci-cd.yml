name: GESTIA CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy
      - name: Run Ruff
        run: ruff check .
      - name: Run MyPy
        run: mypy gestia_core agents api --ignore-missing-imports

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: "pgvector/pgvector:pg16"
        env:
          POSTGRES_USER: gestia
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: gestia_test
        ports: [5432, 5432]
        options: >-
          --health-cmd "pg_isready -U gestia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: "redis:7-alpine"
        ports: [6379, 6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run migrations
        run: |
          DATABASE_URL=postgresql+asyncpg://gestia:testpass@localhost:5432/gestia_test
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://gestia:testpass@localhost:5432/gestia_test
      - name: Run unit tests
        run: |
          pytest tests/unit -v --cov=gestia_core --cov=agents --cov=api --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://gestia:testpass@localhost:5432/gestia_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-for-testing-only-32-chars-minimum
          N8N_ENCRYPTION_KEY: test-encryption-key-32-bytes-base64
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: "pgvector/pgvector:pg16"
        env:
          POSTGRES_USER: gestia
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: gestia_test
        ports: [5432, 5432]
        options: >-
          --health-cmd "pg_isready -U gestia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: "redis:7-alpine"
        ports: [6379, 6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      minio:
        image: "minio/minio:latest"
        env:
          MINIO_ROOT_USER: gestia
          MINIO_ROOT_PASSWORD: testpass123
        ports: [9000, 9000]
        options: --health-cmd "curl -f http://localhost:9000/minio/health/live" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run migrations
        run: |
          DATABASE_URL=postgresql+asyncpg://gestia:testpass@localhost:5432/gestia_test
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://gestia:testpass@localhost:5432/gestia_test
      - name: Run integration tests
        run: pytest tests/integration -v
        env:
          DATABASE_URL: postgresql+asyncpg://gestia:testpass@localhost:5432/gestia_test
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_ROOT_USER: gestia
          MINIO_ROOT_PASSWORD: testpass123
          MINIO_BUCKET: gestia-documents
          MINIO_SECURE: "false"
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-for-testing-only-32-chars-minimum
          N8N_ENCRYPTION_KEY: test-encryption-key-32-bytes-base64

  test-contract:
    name: Contract Tests (Schemathesis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: "pgvector/pgvector:pg16"
        env:
          POSTGRES_USER: gestia
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: gestia_test
        ports: [5432, 5432]
        options: >-
          --health-cmd "pg_isready -U gestia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" schemathesis
      - name: Start API server
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://gestia:testpass@localhost:5432/gestia_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-for-testing-only-32-chars-minimum
      - name: Run contract tests
        run: |
          schemathesis run --hypothesis-max-examples=50 http://localhost:8000/openapi.json --base-url=http://localhost:8000

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract metadata for Web UI
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Web UI
        uses: docker/build-push-action@v5
        with:
          context: ./web-ui
          file: ./web-ui/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to Staging
        run: echo "Deploy to staging via Coolify/Railway/SSH"
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to Production
        run: echo "Deploy to production via Coolify/Railway/SSH with blue-green"
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      - name: Run Bandit (Python security)
        run: |
          pip install bandit
          bandit -r gestia_core agents api -f json -o bandit-results.json || true
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD