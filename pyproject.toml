[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gestia"
version = "0.1.0"
description = "GESTIA — Asistente multi-agente para asesoría/gestoría (mercantil, administrativo, contable, personal)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JasCano" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pgvector>=0.3.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "boto3>=1.34.0",
    "minio>=7.2.0",
    "redis>=5.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
    "schemathesis>=3.30.0",
    "testcontainers>=4.7.0",
]
ocr = [
    "docling>=2.0.0",
    "docling-core>=2.0.0",
    "tiktoken>=0.7.0",
]
llm = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
]

[project.scripts]
gestia-dev = "gestia_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gestia_core", "agents", "shared", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=gestia_core --cov=agents --cov=shared --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true